<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>伎乐飞天</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'STSong', '宋体', serif; }

        #bgVideo {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -2;
        }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.35); z-index: -1;
        }

        .top-bar {
            position: fixed; top: 0; left: 0; width: 100%;
            padding: 12px 16px;
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
            z-index: 10;
            pointer-events: none;
        }
        .top-bar .back {
            pointer-events: auto;
            color: #C9A96E; text-decoration: none; font-size: 16px;
            padding: 6px 12px; background: rgba(0,0,0,0.5); border-radius: 20px;
        }
        .top-bar h2 {
            color: #C9A96E; font-size: 20px; letter-spacing: 3px;
            text-shadow: 1px 1px 3px #000;
            position: absolute; left: 50%; transform: translateX(-50%);
        }

        .bottom-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            padding: 16px 20px 24px;
            display: flex; align-items: center; justify-content: center;
            gap: 12px; flex-wrap: wrap;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            z-index: 10;
        }
        .play-btn {
            background-color: #C9A96E; color: #2E1E1A;
            border: none; border-radius: 50px;
            padding: 12px 24px;
            font-size: 16px; font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(201,169,110,0.4);
            cursor: pointer;
            transition: 0.2s;
        }
        .play-btn:active { transform: scale(0.96); }
        .info-btn {
            background: rgba(255,255,255,0.15); color: #F5EEDC;
            border: 1px solid rgba(201,169,110,0.5);
            border-radius: 50px;
            padding: 12px 18px;
            font-size: 15px;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        .ar-btn {
            background: linear-gradient(135deg, #C9A96E, #8B3A3A);
            color: #F5EEDC;
            border: none; border-radius: 50px;
            padding: 12px 22px;
            font-size: 15px; font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(201,169,110,0.4);
        }
        .ar-btn.obtained {
            background: #4a7c59;
        }

        .info-panel {
            position: fixed; bottom: -100%; left: 0; width: 100%;
            max-height: 70vh;
            background: rgba(30, 20, 15, 0.95);
            border-top-left-radius: 20px; border-top-right-radius: 20px;
            padding: 24px 20px 30px;
            transition: bottom 0.4s ease;
            z-index: 20;
            overflow-y: auto;
            color: #F5EEDC;
            line-height: 1.8;
            font-size: 15px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
            border-top: 1px solid rgba(201,169,110,0.3);
        }
        .info-panel.show { bottom: 0; }
        .info-panel h3 {
            color: #C9A96E; font-size: 18px; margin-bottom: 12px;
            letter-spacing: 2px;
        }
        .close-info {
            position: absolute; top: 12px; right: 16px;
            background: none; border: none; color: #C9A96E;
            font-size: 24px; cursor: pointer; padding: 4px;
        }

        .toast {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(30, 20, 15, 0.95);
            color: #C9A96E;
            padding: 18px 28px;
            border-radius: 16px;
            border: 1px solid rgba(201,169,110,0.5);
            font-size: 17px;
            letter-spacing: 1px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        audio { display: none; }
    </style>
</head>
<body>
    <video autoplay muted loop playsinline id="bgVideo" poster="images/postcard_feitian2.jpg">
        <source src="images/feitian2.mp4" type="video/mp4">
    </video>
    <div id="overlay"></div>

    <div class="top-bar">
        <a href="index.html?view=explore" class="back">← 返回</a>
        <h2>🎵 伎乐飞天</h2>
    </div>

    <div class="bottom-bar">
        <button class="play-btn" id="playBtn">▶ 播放讲解</button>
        <button class="info-btn" id="infoBtn">📖 介绍</button>
        <a href="https://www.kivicube.com/scenes/OhVTv1RQxGMKnYYa9CznmyKLt2rbN4FT" 
           class="ar-btn" id="arBtn" target="_blank" rel="noopener noreferrer">✨ 唤醒神女</a>
    </div>

    <div class="info-panel" id="infoPanel">
        <button class="close-info" id="closeInfo">✕</button>
        <h3>伎乐飞天</h3>
        <p>
            伎乐飞天是敦煌壁画中最具动感的一类形象，她们手持各种乐器，在极乐世界中奏响天籁。<br><br>
            画面中的飞天，将琵琶置于颈后，双臂反握琴颈，这一高难度的艺术造型，现实中无法演奏，却恰恰代表了唐代艺术家对音乐极致的自由幻想。除了琵琶，还有箜篌、筚篥、腰鼓、横笛等十几种乐器。特别的是，在壁画中还有许多“不鼓自鸣”的乐器，飘带缠绕琴身，无人弹奏却自有妙音。这些伎乐飞天不仅是舞蹈与音乐的融合，更是丝绸之路上东西方文明在音律上的交汇见证。
        </p>
    </div>

    <audio id="audio" src="audio/feitian2.mp3"></audio>

    <div class="toast" id="toast"></div>

    <script>
        function getCardId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('card') || 'default';
        }
        function getMedals() {
            const key = 'dunhuang_medals_' + getCardId();
            try { return JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { return {}; }
        }
        function recordMedal(medalId) {
            const key = 'dunhuang_medals_' + getCardId();
            const medals = getMedals();
            medals[medalId] = { obtained: true, time: new Date().toISOString() };
            localStorage.setItem(key, JSON.stringify(medals));
        }
        function hasMedal(medalId) {
            const medals = getMedals();
            return medals[medalId] && medals[medalId].obtained;
        }

        const btn = document.getElementById('playBtn');
        const audio = document.getElementById('audio');
        const infoBtn = document.getElementById('infoBtn');
        const infoPanel = document.getElementById('infoPanel');
        const closeInfo = document.getElementById('closeInfo');
        const arBtn = document.getElementById('arBtn');
        const toast = document.getElementById('toast');

        btn.addEventListener('click', function() {
            if (audio.paused) {
                audio.play();
                btn.textContent = '⏸️ 暂停';
            } else {
                audio.pause();
                btn.textContent = '▶ 播放讲解';
            }
        });
        audio.addEventListener('ended', function() {
            btn.textContent = '▶ 播放讲解';
        });

        infoBtn.addEventListener('click', function() {
            infoPanel.classList.add('show');
        });
        closeInfo.addEventListener('click', function() {
            infoPanel.classList.remove('show');
        });
        infoPanel.addEventListener('click', function(e) {
            if (e.target === infoPanel) {
                infoPanel.classList.remove('show');
            }
        });

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2200);
        }

        if (hasMedal('feitian2')) {
            arBtn.classList.add('obtained');
            arBtn.textContent = '✨ 已唤醒';
        }

        arBtn.addEventListener('click', function() {
            if (!hasMedal('feitian2')) {
                recordMedal('feitian2');
                arBtn.classList.add('obtained');
                showToast('🏅 恭喜获得「伎乐飞天」勋章！');
                setTimeout(() => {
                    arBtn.textContent = '✨ 已唤醒';
                }, 800);
            }
        });
    </script>
</body>
</html>
